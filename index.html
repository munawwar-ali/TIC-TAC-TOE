<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="msg-winner hide">
      <p id="msg">WINNER</p>
      <button id="new-btn">New Game</button>
    </div>
    <main>
      <p id="history"></p>
      <h3 class="tic">Tic-Tac-Toe</h3>

      <p id="turn">"O" TURN</p>

      <div class="container">
        <div class="game">
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
          <div><button id="box"></button></div>
        </div>
      </div>
      <button id="rstbtn">RESET BOARD</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
